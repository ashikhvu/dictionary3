{% extends 'curry_shop_base.html' %}

{% block body_block %}


<style>
    .login_card{
        background-image: linear-gradient(45deg,rgba(0, 0, 0, 0.781),rgba(0, 0, 0, 0.567));
        padding: 5rem 3rem 10rem 3rem;
        border-radius: 2%;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: -10px 10px 15px 15px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
    }
    .login_card_light_border{
        padding: 1px;
        background-image: linear-gradient(45deg,rgba(255, 255, 255, 0));
        border-radius: 2%;
    }
    .form-label{
        color: white;
    }
    body{
        background-image: url("static/images/bg/vegetables-set-left-black-slate_flipped.webp");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
    }
    @media screen and (max-width:1024px){
        .login_card{
            padding: 5rem 1rem 10rem 1rem;
        }
        body{
            font-size: 0.9rem;
        }
        .col_adjust{
            margin: 0px;
            padding: 0px;
        }
    }
    .text_shadow{
        text-shadow: 3px 3px 3px black;
    }
</style>

<br><br><br><br><br>
<div class="row">
    <div class="col-12 col-sm-12 col-md-3 col-lg-3"></div>
    <div class="col-12 col-sm-12 col-md-6 col-lg-6">
        <div class="text-center login_card">
            <h2 class="text-light text_shadow  mt-5">You have been loged out!</h2><br>
            <a class="btn btn-success" href="{% url 'login' %}">Login</a>
        </div>
    </div>
    <div class="col-12 col-sm-12 col-md-3 col-lg-3"></div>
</div>


{% endblock %}
